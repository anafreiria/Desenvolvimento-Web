<!DOCTYPE html>
	<html>
	<head>
		<title>Cor e imagem de fundo</title>
		<meta charset="utf-8">
		
		<!-- Seletores internal style -->
		<!-- Comentarios em HTML -->
		<style type="text/css">
			
			.fundo {
				background: gray;
				color: white;
			}

			div {
				background-image: url('Imagens/yoshi.png') ;
				background-repeat: no-repeat;

				/*Para que a iamgem fique fixa mesmo rolando a tela*/
				background-attachment: fixed;

				/*
				primeiro valor (horizontal) : left, center, right
				segundo valor (vertical): top, center, bottom */
				background-position: center;

				opacity: 0.3;
			}

			.fundo2 {
				background: blue url('Imagens/yoshi.png');
			}
			
		</style>

	</head>

	<body class="fundo2" >
		<div>
			<h1> Conteúdo de título</h1>	
		</div>
	

	</body>
</html>
