<!DOCTYPE html>
	<html>
	<head>
		<meta charset="utf-8">
		<title>Estilos de textos</title>

		<!-- Seletores internal style -->
		<!-- Comentarios em HTML -->
		<style type="text/css">

			body {
				font-size: 40px;
				font-family: "Times Nem Roman", Times, serif;
			}

			.negrito {
				/* normal, bold, 100 até 900 */
				font-weight: 900;
			}

			.italico {
				font-style: italic;
			}

			.formatacao {
				/*text-decoration: underline;*/
				/*text-decoration: overline;*/
				text-decoration: line-through;
			}

			.texto {
				font: bold 40 px  "Times Nem Roman", Times, serif;
			}
			

			
		</style>

	</head>
	<body >

		<p>Texto Negrito</p>
		<p class="negrito">Texto Negrito</p>
		<p class="italico">Texto Negrito</p>

		<p class="formatacao">Formatação</p>
		<p class="texto">Texto</p>
	    <p>Padrão</p>
	</body>
</html>
