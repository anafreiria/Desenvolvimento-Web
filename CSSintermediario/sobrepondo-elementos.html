<!DOCTYPE html>
<html>
<head>
	<title> Posicionamento (static, relative, absolute e fixed)</title>
	<meta charset="utf-8">

	<style type="text/css">
		
		.conteudo1{
			border: 1px solid white;
			background: orange;
			width: 200px;
			height: 200px;
			position: absolute;
			z-index: 0;
		}

		.conteudo2{
			border: 1px solid white;
			background: greenyellow;
			width: 200px;
			height: 200px;
			position: absolute;
			top: 120px;
			left: 120px;
			z-index: 2;
		}

		.conteudo3{
			border: 1px solid white;
			background: green;
			width: 200px;
			height: 200px;
			position: absolute;
			top: 210px;
			left: 220px;
			z-index:3 ;

		}
	
	</style>
	
	
</head>
<body>

	<div class="conteudo1">
		conteudo 1	
	</div>

	<div class="conteudo2">
		conteudo 2	
	</div>
	<div class="conteudo3">
		conteudo 3	
	</div>



</body>
</html>
