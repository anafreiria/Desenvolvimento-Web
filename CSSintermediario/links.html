<!DOCTYPE html>
<html>
<head>
	<title>Links</title>

	<meta charset="utf-8">
	<style type="text/css">
		

		a{
			padding: 5px 10px;
			text-decoration: none ;

		}

		/*Links não visitados*/
		a:link {
			color: #b9c941;
		}

		/*Links visitados*/
		a:visited{
			color: red;
		}

		/*Links Hover, passa o cursor sobre o link*/
		a:hover{
			color: #6d790f;
			background: greenyellow;
		}

		/*Links ativos, quando clicados*/
		a:active{
			color: black;
		}


	</style>

	
</head>
<body>

	<a href="https://academico.unifal-mg.edu.br:8443/academico/discente/welcome"> UNIFAL</a> |


	<a href="https://www.nasa.gov/"> NASA</a> |

	<a href="https://www.udemy.com/"> UDEMY</a>

</body>
</html>
